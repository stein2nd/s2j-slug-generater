name: Version sync

on:
  push:
    paths:
      - package.json
      - package-lock.json
      - s2j-slug-generater.php
      - src/gutenberg/block.json
      - scripts/sync-version.mjs
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - s2j-slug-generater.php
      - src/gutenberg/block.json
      - scripts/sync-version.mjs

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify version fields match package.json
        run: node scripts/sync-version.mjs --check
